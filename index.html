<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Lotto Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-mesh"></div>
    <main class="container">
        <button id="theme-toggle" class="theme-toggle" aria-label="테마 변경">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <header>
            <h1>LOTTO <span>6/45</span></h1>
            <p>행운의 번호를 확인해보세요</p>
        </header>

        <section class="display-area">
            <div id="numbers" class="numbers-container">
                <!-- Lotto balls will be injected here -->
                <div class="placeholder">번호를 생성해주세요</div>
            </div>
        </section>

        <section class="action-area">
            <button id="generate" class="glow-button">번호 생성하기</button>
        </section>

        <lotto-history></lotto-history>
    </main>
    <script src="main.js"></script>
</body>
</html>
